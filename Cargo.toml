[package]
name = "_mcr_py"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_mcr_py"
crate-type = ["cdylib"]

[dependencies]
bimap = "0.6.3"
fast_paths = { git = "https://github.com/easbar/fast_paths.git", rev = "6d236d1be5f341071c65ee36c540279986cf7231" }
rayon = "1.7.0"
mlc = { version = "0.1.0", path = "mlc" }
osmtools = { version = "0.1.0", path = "osmtools" }
log = "0.4.20"
reqwest = { version = "0.12.12", features = ["blocking"] }
pyo3 = "0.23"
pyo3-log = "0.12.3"
pyo3-polars = "0.20.0"
polars = { version = "0.46.0", features = ["lazy", "dtype-struct"] }
petgraph = "0.8.1"
