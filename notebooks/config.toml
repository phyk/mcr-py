[run_type]
run_type="INFO"

[geography]
crs_sink_name="EPSG:4839"

[timestamp]
timestamp="20260619"
# now="2025-07-18-114512"
# now="2025-08-08-114512"
# now="2025-09-05-143520"
now="20260619-093700"

[gtfs]
timestamp="20260619"
# Max distance (m) between a GTFS stop and the walking node it snaps to; stops
# further away get no node and are unreachable for public transport.
max_snap_distance_m=80.0

[modes.walking]
speed_kmh=5

[modes.private_bike]
speed_kmh=15
switch_time_s=0
price_function_base=10

[modes.private_car]
speed_kmh=50
switch_time_s=0
price_function_base=20

# shared_bicycle/shared_scooter settings stay defined for when the pipeline
# gains a step to produce graph/<city>/shared_{bike,scooter}_stations.parquet
# + dropoff_zones.geojson; excluded from `[mcr5] scenarios` for now.
[modes.shared_bicycle]
# The old "next_bike_no_tariff" scenario: nextbike shared bikes with no fare.
speed_kmh=15
switch_time_s=30
unlock_fee=0
interval_minutes=1
price_per_interval=0
first_interval_free=true

[modes.shared_scooter]
# Placeholder pricing mirrored from the mcr-rust integration-test fixture;
# no real operator tariff has been sourced for this mode yet.
speed_kmh=20
switch_time_s=30
unlock_fee=100
interval_minutes=5
price_per_interval=150
first_interval_free=false

[modes.public_transport]
start_times=["08:00:00"]
# Everything below was previously a hidden Rust-side default (mirroring the
# De Lijn/Brugge fixture's tariff). Now explicit and overridable per city.
flex_window_secs=600
short_trip_fare_cents=220
short_trip_max_stops=4
long_trip_fare_cents=320
switch_time_secs=0

[mcr5]
# Enables the POI-category limits pruning (see mcr-rust's `build_initial_limits`)
# for every scenario below.
enable_limit=true
# Each entry is the set of modes run together in one MCR pass. "walking" is
# always included as the access/egress layer even if omitted from a combo;
# list it alone (["walking"]) for a walking-only run. A combo can list more
# than one mode (e.g. ["private_bike", "public_transport"]) to run them
# together. Shared modes are excluded until the pipeline produces their
# station/dropoff-zone layers (see comment above [modes.shared_bicycle]).
scenarios=[
    ["walking"],
    ["private_bike"],
    ["private_car"],
    ["public_transport"],
]

[city.cologne]
german="K\u00F6ln"
german_alt="Koeln"
gbfs_url="https://gbfs.nextbike.net/maps/gbfs/v1/nextbike_kg/de/free_bike_status.json"
admin_level=6

